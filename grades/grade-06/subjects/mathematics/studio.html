<script>
(function(){'use strict';
var n=Number(new URLSearchParams(location.search).get('week')),status=document.getElementById('studioStatus');
if(!Number.isInteger(n)||n<1||n>36){status.textContent='Choose a valid week from the mathematics course portal.';return}
var file='week-'+String(n).padStart(2,'0')+'.html';
document.getElementById('originalWeek').href=file;
fetch(file,{credentials:'same-origin'}).then(function(r){if(!r.ok)throw Error('Week is unavailable');return r.text()}).then(function(html){
var doc=new DOMParser().parseFromString(html,'text/html');
var heading=doc.querySelector('main .heading'),all=Array.from(doc.querySelectorAll('main article.lesson'));
var days=['Monday','Tuesday','Wednesday','Thursday','Friday'];
var articles=days.map(function(day){return all.find(function(a){var h=a.querySelector('h2,h3,h4');return h&&new RegExp('^'+day+'(?:\\b|\\s*[-—:])','i').test(h.textContent.trim())})});
if(articles.some(function(a){return !a}))throw Error('The original mathematics week is missing a daily lesson');
var title=heading?heading.querySelector('h1'):doc.querySelector('#mathWeekTitle'),s=document.querySelector('main .heading');
s.querySelector('h1').textContent=title?title.textContent:'Mathematics Studio';
status.textContent='Week '+String(n).padStart(2,'0')+' · Original daily instruction preserved · Practice only';
var mount=document.getElementById('studioSource');
articles.forEach(function(a){mount.appendChild(document.importNode(a,true))});
var script=document.createElement('script');script.src='../../../../assets/khaemenes-middle-math-portal-studio-v1.js';document.body.appendChild(script);
}).catch(function(err){status.textContent='The interactive view is unavailable. Open the original week to continue learning.';console.warn(err)});
})();
</script>
