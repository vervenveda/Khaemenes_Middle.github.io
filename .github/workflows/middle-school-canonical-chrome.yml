      - 'tools/semantic-hierarchy-audit.mjs'\nname: Middle School Canonical Chrome

on:
  push:
    branches: [main]
    paths:
      - 'assets/middle-school-global-chrome-v1.js'
      - 'tools/middle-school-chrome-audit.mjs'
      - '.github/workflows/middle-school-canonical-chrome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical Middle School chrome loader on every HTML page
        run: node tools/middle-school-chrome-audit.mjs --write
      - name: Verify canonical Middle School chrome coverage
        run: node tools/middle-school-chrome-audit.mjs --check
      - name: Validate patch
        run: git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Middle School HTML pages required chrome repair."
            exit 0
          fi
          git config user.name "Khaemenes Academy Automation"
          git config user.email "khaemenesacademy@users.noreply.github.com"
          git add -A -- ':!node_modules' ':!.git'
          git commit -m "Standardize Middle School canonical chrome"
          git push
