name: Middle curriculum integrity
on:
  push:
    branches: [main]
    paths:
      - 'grades/grade-06/**'
      - 'grades/grade-07/**'
      - 'grades/grade-08/**'
      - 'tests/test_middle_curriculum_integrity.py'
      - 'tests/test_grade8_week_plan_links.py'
      - 'tests/test_middle_video_release.py'
      - 'tools/validate-middle-english-week01.mjs'
      - 'tools/validate-middle-english-week02.mjs'
      - 'tools/validate-middle-english-week03.mjs'
      - 'tools/validate-middle-english-week04.mjs'
      - 'tools/validate-middle-english-week05.mjs'
      - 'tools/validate-middle-english-week06.mjs'
      - 'tools/validate-middle-english-week07.mjs'
      - 'assets/khaemenes-middle-ela-week01.css'
      - 'resources/video-study/**'
      - '.github/workflows/middle-curriculum-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run full grade 6–8 structural curriculum audit
        run: python3 tests/test_middle_curriculum_integrity.py
      - name: Check restored Grade 8 week 13 and 14 navigation
        run: python3 tests/test_grade8_week_plan_links.py
      - name: Reject unapproved instructional video embeds
        run: python3 tests/test_middle_video_release.py
      - name: Verify English 6–8 Week 01 lessons and adult-only completion flags
        run: node tools/validate-middle-english-week01.mjs
      - name: Verify English 6–8 Week 02 original texts, evidence and progression
        run: node tools/validate-middle-english-week02.mjs
      - name: Verify English 6–8 Week 03 information texts, source perspective and academic integrity
        run: node tools/validate-middle-english-week03.mjs
      - name: Verify English 6–8 Week 04 civic-data literacy and assessment safety
        run: node tools/validate-middle-english-week04.mjs
      - name: Verify English 6–8 Week 05 procedural writing, source credibility and competing explanations
        run: node tools/validate-middle-english-week05.mjs
      - name: Verify English 6–8 Week 06 original texts, attribution and research synthesis
        run: node tools/validate-middle-english-week06.mjs
      - name: Verify English 6–8 Week 07 source-supported reasoning, grammar and map/proof integrity
        run: node tools/validate-middle-english-week07.mjs
