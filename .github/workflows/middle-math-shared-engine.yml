name: Middle Mathematics Shared Lesson Engine
on:
  push:
    branches: [main]
    paths:
      - "assets/khaemenes-middle-math-lesson-engine-v1.js"
      - "grades/grade-06/subjects/mathematics/lesson-01.html"
      - "grades/grade-07/subjects/mathematics/lesson-01.html"
      - "grades/grade-08/subjects/mathematics/lesson-01.html"
      - "grades/grade-08/subjects/mathematics/index.html"
      - "tools/validate-middle-math-shared-engine.mjs"
      - ".github/workflows/middle-math-shared-engine.yml"
  pull_request:
    paths:
      - "assets/khaemenes-middle-math-lesson-engine-v1.js"
      - "grades/grade-06/subjects/mathematics/lesson-01.html"
      - "grades/grade-07/subjects/mathematics/lesson-01.html"
      - "grades/grade-08/subjects/mathematics/lesson-01.html"
      - "grades/grade-08/subjects/mathematics/index.html"
      - "tools/validate-middle-math-shared-engine.mjs"
      - ".github/workflows/middle-math-shared-engine.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate-middle-math-shared-engine.mjs
