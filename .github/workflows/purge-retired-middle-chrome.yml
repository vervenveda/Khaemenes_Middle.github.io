name: One-time Middle Chrome Purge (repair branch)
on:
  push:
    branches:
      - repair/purge-middle-global-chrome-20261120
    paths:
      - '.github/workflows/purge-retired-middle-chrome.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete tags repository-wide
        run: node tools/purge-retired-middle-chrome.mjs
      - name: Verify student-facing VNV contract
        run: node tools/validate-middle-class-tools.mjs
      - name: Verify local reference integrity
        run: node tools/validate-middle-forensic-integrity.mjs
      - name: Commit scoped purge to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Purge retired Middle global chrome references from HTML"
            git push origin HEAD:repair/purge-middle-global-chrome-20261120
          fi
