name: Grade 7 Subject-Week Crosswalk Validation

on:
  pull_request:
    paths:
      - "grades/grade-07/data/course-data.js"
      - "grades/grade-07/data/subject-week-crosswalk.js"
      - "tools/validate-grade7-subject-week-crosswalk.mjs"
      - ".github/workflows/grade7-subject-week-crosswalk-validation.yml"
  push:
    branches: [main]
    paths:
      - "grades/grade-07/data/course-data.js"
      - "grades/grade-07/data/subject-week-crosswalk.js"
      - "tools/validate-grade7-subject-week-crosswalk.mjs"
      - ".github/workflows/grade7-subject-week-crosswalk-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Grade 7 canonical subject-by-week crosswalk
        run: node tools/validate-grade7-subject-week-crosswalk.mjs
      - name: Re-run shared Learning Navigator contract
        run: node tools/validate-middle-learning-navigator.mjs
      - name: Re-run shared Study Scorebook contract
        run: node tools/validate-middle-study-scorebook.mjs
      - name: Re-run one-Mentor contract
        run: node tools/validate-middle-naib-mentor-contract.mjs
      - name: Re-run Middle School repository structure
        run: node scripts/validate-middle-school.mjs
      - name: Validate Grade 7 crosswalk JavaScript syntax
        run: node --check grades/grade-07/data/subject-week-crosswalk.js
