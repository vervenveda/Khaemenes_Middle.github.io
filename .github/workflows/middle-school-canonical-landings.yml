name: Middle School Canonical Landing Validation
on:
  pull_request:
    paths:
      - 'grades/grade-06/index.html'
      - 'grades/grade-07/index.html'
      - 'grades/grade-08/index.html'
      - 'grades/grade-06/subjects/**/index.html'
      - 'grades/grade-07/subjects/**/index.html'
      - 'grades/grade-08/subjects/**/index.html'
      - 'assets/middle-school-landing-shell-v1.js'
      - 'assets/middle-school-landing-shell-v1.css'
      - 'assets/middle-school-landing-class-tools-v1.js'
      - 'assets/khaemenes-middle-breakaway.js'
      - 'tools/validate-middle-school-canonical-landings-v1.cjs'
      - '.github/workflows/middle-school-canonical-landings.yml'
  push:
    branches: [main]
    paths:
      - 'grades/grade-06/index.html'
      - 'grades/grade-07/index.html'
      - 'grades/grade-08/index.html'
      - 'grades/grade-06/subjects/**/index.html'
      - 'grades/grade-07/subjects/**/index.html'
      - 'grades/grade-08/subjects/**/index.html'
      - 'assets/middle-school-landing-shell-v1.js'
      - 'assets/middle-school-landing-shell-v1.css'
      - 'assets/middle-school-landing-class-tools-v1.js'
      - 'assets/khaemenes-middle-breakaway.js'
      - 'tools/validate-middle-school-canonical-landings-v1.cjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-middle-school-canonical-landings-v1.cjs
