name: Middle School Study Scorebook Validation

on:
  pull_request:
    paths:
      - "grades/grade-06/**"
      - "grades/grade-07/**"
      - "grades/grade-08/**"
      - "assets/khaemenes-middle-study-scorebook.js"
      - "assets/khaemenes-middle-learning-navigator.js"
      - "tools/validate-middle-study-scorebook.mjs"
      - ".github/workflows/middle-study-scorebook-validation.yml"
  push:
    branches: [main]
    paths:
      - "grades/grade-06/**"
      - "grades/grade-07/**"
      - "grades/grade-08/**"
      - "assets/khaemenes-middle-study-scorebook.js"
      - "assets/khaemenes-middle-learning-navigator.js"
      - "tools/validate-middle-study-scorebook.mjs"
      - ".github/workflows/middle-study-scorebook-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate shared Middle School Study Scorebook
        run: node tools/validate-middle-study-scorebook.mjs
      - name: Revalidate shared Middle School Learning Navigator
        run: node tools/validate-middle-learning-navigator.mjs
