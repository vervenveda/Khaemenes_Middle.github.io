name: Middle School Learning Engine Regression

on:
  push:
    branches:
      - main
    paths:
      - 'assets/khaemenes-middle-focus-map.js'
      - 'assets/khaemenes-middle-question-factory.js'
      - 'assets/khaemenes-middle-learning-ledger.js'
      - 'assets/khaemenes-middle-assessment-engine.js'
      - 'assets/khaemenes-middle-learning-context.js'
      - 'assets/khaemenes-middle-mentors.js'
      - 'mentor-manifest.json'
      - 'mentor-contract.json'
      - 'assets/khaemenes-grade-continuity.js'
      - 'grades/grade-*/assets/app.js'
      - 'grades/grade-*/assets/certificate.js'
      - 'grades/grade-*/subjects/**'
      - 'grades/grade-*/weekly-plans/**'
      - 'grades/grade-*/assessments/**'
      - 'scripts/inject-middle-learning-engine.mjs'
      - 'tools/validate-middle-learning-engine.mjs'
      - 'tools/validate-grade6-week1-assessment.mjs'
      - 'tools/validate-grade6-week1-22-quality.mjs'
      - 'tools/validate-grade6-week26-assessment.mjs'
      - 'tools/validate-grade6-week27-assessment.mjs'
      - 'tools/validate-grade6-week28-assessment.mjs'
      - 'tools/validate-grade6-week29-assessment.mjs'
      - 'tools/validate-grade6-week30-assessment.mjs'
      - 'tools/validate-grade6-week31-assessment.mjs'
      - 'tools/validate-grade6-week32-assessment.mjs'
      - 'tools/validate-grade6-week33-assessment.mjs'
      - 'tools/validate-grade6-week34-assessment.mjs'
      - 'tools/validate-grade6-week35-assessment.mjs'
      - 'tools/validate-grade6-week36-assessment.mjs'
      - 'tools/validate-grade6-learner-persistence.mjs'
      - '.github/workflows/middle-learning-engine-regression.yml'
  pull_request:
    paths:
      - 'assets/khaemenes-middle-focus-map.js'
      - 'assets/khaemenes-middle-question-factory.js'
      - 'assets/khaemenes-middle-learning-ledger.js'
      - 'assets/khaemenes-middle-assessment-engine.js'
      - 'assets/khaemenes-middle-learning-context.js'
      - 'assets/khaemenes-middle-mentors.js'
      - 'mentor-manifest.json'
      - 'mentor-contract.json'
      - 'assets/khaemenes-grade-continuity.js'
      - 'grades/grade-*/assets/app.js'
      - 'grades/grade-*/assets/certificate.js'
      - 'grades/grade-*/subjects/**'
      - 'grades/grade-*/weekly-plans/**'
      - 'grades/grade-*/assessments/**'
      - 'scripts/inject-middle-learning-engine.mjs'
      - 'tools/validate-middle-learning-engine.mjs'
      - 'tools/validate-grade6-week1-assessment.mjs'
      - 'tools/validate-grade6-week1-22-quality.mjs'
      - 'tools/validate-grade6-learner-persistence.mjs'
      - '.github/workflows/middle-learning-engine-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middle-learning-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate every Middle School lesson, quiz, and test
        run: node tools/validate-middle-learning-engine.mjs
      - name: Certify Grade 6 Week 1 randomized subject questions
        run: node tools/validate-grade6-week1-assessment.mjs
      - name: Audit Grade 6 Weeks 1–22 subject plans and printable learner journeys
        run: node tools/validate-grade6-week1-22-quality.mjs
      - name: Certify Week 26 subject assessment with 3000 seeded draws
        run: node tools/validate-grade6-week26-assessment.mjs
      - name: Certify Week 27 assessment with 3000 seeded draws
        run: node tools/validate-grade6-week27-assessment.mjs
      - name: Certify Week 28 assessment with 3000 seeded draws
        run: node tools/validate-grade6-week28-assessment.mjs
      - name: Certify Week 29 assessment with 3000 seeded draws
        run: node tools/validate-grade6-week29-assessment.mjs
      - name: Certify Week 30 with 3000 seeded draws
        run: node tools/validate-grade6-week30-assessment.mjs
      - name: Certify Week 31 with 3000 seeded draws
        run: node tools/validate-grade6-week31-assessment.mjs
      - name: Certify Week 32 with 3000 seeded draws
        run: node tools/validate-grade6-week32-assessment.mjs
      - name: Certify Week 33 with 3000 seeded draws
        run: node tools/validate-grade6-week33-assessment.mjs
      - name: Certify Week 34 with 3000 seeded draws
        run: node tools/validate-grade6-week34-assessment.mjs
      - name: Certify Week 35 with 3000 seeded draws
        run: node tools/validate-grade6-week35-assessment.mjs
      - name: Certify Week 36 with 3000 seeded draws
        run: node tools/validate-grade6-week36-assessment.mjs
      - name: Test Grade 6 learner persistence and identity isolation
        run: node tools/validate-grade6-learner-persistence.mjs
