name: Middle Mathematics Full-Course Validation
on:
  push:
    branches: [main]
    paths:
      - "assets/khaemenes-middle-learning-context.js"
      - "assets/khaemenes-middle-math-portal-studio-v1.js"
      - "assets/khaemenes-middle-math-week-practice-v1.js"
      - "assets/grade-07-mathematics-studio-v1.js"
      - "assets/khaemenes-middle-question-factory.js"
      - "grades/grade-06/subjects/mathematics/**"
      - "grades/grade-07/subjects/mathematics/**"
      - "grades/grade-08/subjects/mathematics/**"
      - "tools/validate-middle-math-full-course.mjs"
      - "tools/validate-grade6-math-lesson01-depth.mjs"
      - ".github/workflows/middle-math-full-course.yml"
  pull_request:
    paths:
      - "assets/khaemenes-middle-learning-context.js"
      - "assets/khaemenes-middle-math-portal-studio-v1.js"
      - "assets/khaemenes-middle-math-week-practice-v1.js"
      - "assets/grade-07-mathematics-studio-v1.js"
      - "assets/khaemenes-middle-question-factory.js"
      - "grades/grade-06/subjects/mathematics/**"
      - "grades/grade-07/subjects/mathematics/**"
      - "grades/grade-08/subjects/mathematics/**"
      - "tools/validate-middle-math-full-course.mjs"
      - "tools/validate-grade6-math-lesson01-depth.mjs"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate-middle-math-full-course.mjs
      - run: node tools/validate-middle-math-shared-engine.mjs
      - run: node tools/validate-grade6-math-lesson01-depth.mjs
