name: Middle Mathematics Full-Course Validation
on:
  push:
    branches: [main]
    paths:
      - "assets/khaemenes-middle-learning-context.js"
      - "assets/khaemenes-grade6-math-depth-a3-v1.js"
      - "assets/khaemenes-middle-math-portal-studio-v1.js"
      - "assets/khaemenes-middle-math-week-practice-v1.js"
      - "assets/grade-07-mathematics-studio-v1.js"
      - "assets/khaemenes-middle-question-factory.js"
      - "grades/grade-06/subjects/mathematics/**"
      - "grades/grade-07/subjects/mathematics/**"
      - "grades/grade-08/subjects/mathematics/**"
      - "tools/validate-middle-math-full-course.mjs"
      - "tools/validate-grade7-grade8-math-foundation-weeks01-03.mjs"
      - "tools/validate-grade6-math-lesson01-depth.mjs"
      - "tools/validate-grade6-math-a3-curriculum.mjs"
      - "tools/validate-grade6-math-supplemental-certification.mjs"
      - "tools/validate-grade6-math-editorial-sample.mjs"
      - "tools/validate-grade6-math-official-numeric-answers.mjs"
      - "tools/validate-grade6-math-official-numeric-extension.mjs"
      - "tools/validate-grade6-math-coordinate-algebra-answers.mjs"
      - "tools/validate-grade6-math-early-week-07-13-answers.mjs"
      - "tools/validate-grade6-math-early-week-01-06-answers.mjs"
      - "tools/validate-grade6-math-early-week-14-19-answers.mjs"
      - "tools/validate-grade6-math-supplemental-weeks34-36-editorial.mjs"
      - "tools/validate-grade6-math-supplemental-weeks31-33-editorial.mjs"
      - "tools/validate-grade6-math-supplemental-weeks28-30-editorial.mjs"
      - "tools/validate-grade6-math-supplemental-weeks25-27-editorial.mjs"
      - "tools/validate-grade6-math-guidance-weeks22-24.mjs"
      - ".github/workflows/middle-math-full-course.yml"
  pull_request:
    paths:
      - "assets/khaemenes-middle-learning-context.js"
      - "assets/khaemenes-grade6-math-depth-a3-v1.js"
      - "assets/khaemenes-middle-math-portal-studio-v1.js"
      - "assets/khaemenes-middle-math-week-practice-v1.js"
      - "assets/grade-07-mathematics-studio-v1.js"
      - "assets/khaemenes-middle-question-factory.js"
      - "grades/grade-06/subjects/mathematics/**"
      - "grades/grade-07/subjects/mathematics/**"
      - "grades/grade-08/subjects/mathematics/**"
      - "tools/validate-middle-math-full-course.mjs"
      - "tools/validate-grade7-grade8-math-foundation-weeks01-03.mjs"
      - "tools/validate-grade6-math-lesson01-depth.mjs"
      - "tools/validate-grade6-math-a3-curriculum.mjs"
      - "tools/validate-grade6-math-supplemental-certification.mjs"
      - "tools/validate-grade6-math-editorial-sample.mjs"
      - "tools/validate-grade6-math-official-numeric-answers.mjs"
      - "tools/validate-grade6-math-official-numeric-extension.mjs"
      - "tools/validate-grade6-math-coordinate-algebra-answers.mjs"
      - "tools/validate-grade6-math-early-week-07-13-answers.mjs"
      - "tools/validate-grade6-math-early-week-01-06-answers.mjs"
      - "tools/validate-grade6-math-early-week-14-19-answers.mjs"
      - "tools/validate-grade6-math-supplemental-weeks34-36-editorial.mjs"
      - "tools/validate-grade6-math-supplemental-weeks31-33-editorial.mjs"
      - "tools/validate-grade6-math-supplemental-weeks28-30-editorial.mjs"
      - "tools/validate-grade6-math-supplemental-weeks25-27-editorial.mjs"
      - "tools/validate-grade6-math-guidance-weeks22-24.mjs"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate-middle-math-full-course.mjs
      - run: node tools/validate-grade7-grade8-math-foundation-weeks01-03.mjs
      - run: node tools/validate-middle-math-shared-engine.mjs
      - run: node tools/validate-grade6-math-lesson01-depth.mjs
      - run: node tools/validate-grade6-math-a3-curriculum.mjs
      - run: node tools/validate-grade6-math-supplemental-certification.mjs
      - run: node tools/validate-grade6-math-editorial-sample.mjs
      - run: node tools/validate-grade6-math-official-numeric-answers.mjs
      - run: node tools/validate-grade6-math-official-numeric-extension.mjs
      - run: node tools/validate-grade6-math-coordinate-algebra-answers.mjs
      - run: node tools/validate-grade6-math-early-week-07-13-answers.mjs
      - run: node tools/validate-grade6-math-early-week-01-06-answers.mjs
      - run: node tools/validate-grade6-math-early-week-14-19-answers.mjs
      - run: node tools/validate-grade6-math-supplemental-weeks34-36-editorial.mjs
      - run: node tools/validate-grade6-math-supplemental-weeks31-33-editorial.mjs
      - run: node tools/validate-grade6-math-supplemental-weeks28-30-editorial.mjs
      - run: node tools/validate-grade6-math-supplemental-weeks25-27-editorial.mjs
      - run: node tools/validate-grade6-math-guidance-weeks22-24.mjs
